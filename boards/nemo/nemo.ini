[env:nemo]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/nemo>
build_flags =
    ${env.build_flags}
    -Iboards/nemo
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
    ; Ограничиваем IR протоколы (4MB флеш)
    -D_IR_ENABLE_DEFAULT_=false
    -DDECODE_NEC=true   -DSEND_NEC=true
    -DDECODE_SAMSUNG=true -DSEND_SAMSUNG=true
    -DDECODE_RC5=true   -DSEND_RC5=true
    -DDECODE_RC6=true   -DSEND_RC6=true
    -DDECODE_LG=true    -DSEND_LG=true
    -DDECODE_SONY=true  -DSEND_SONY=true
    -DSEND_PANASONIC=true -DDECODE_PANASONIC=true
    -DSEND_RAW=true
    -DSAFE_STACK_BUFFER_SIZE=8192

lib_deps =
    ${env.lib_deps}

lib_ignore =
    FastLED
    ESP8266Audio
    ESP8266SAM
